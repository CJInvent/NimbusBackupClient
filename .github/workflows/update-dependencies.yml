name: Update Dependencies (Manual)

# Bumps Go dependencies across EVERY module in the workspace and pushes the
# result to the branch it was dispatched on.
#
# Rewritten 2026-08-06. What it was doing before:
#
#   * it walked a HARDCODED module list that had drifted from the repository.
#     It cd'd into `service/`, which does not exist -- so the "all" scope
#     failed there every time, after it had already rewritten gui/, snapshot/
#     and machinebackup/ go.mod files and before it reached the commit step.
#     A dispatch left the tree modified and nothing recorded.
#   * that list also MISSED controlplane, imagebrowse, clientcommon,
#     pkg/retry, pkg/security and gui/api -- half the workspace never got
#     updated by the workflow whose job is updating it.
#   * each module named its dependencies by hand, so anything added since the
#     list was written was never bumped.
#   * the `specific` scope had no implementing step. Choosing it ran the
#     commit and push steps over an unmodified tree.
#   * nothing checked that the workspace still BUILT before pushing.
#
# Modules are now discovered from the filesystem, so the workflow cannot fall
# out of step with the repository again, and the result has to compile before
# it is committed.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Update scope'
        required: true
        default: 'patch-only'
        type: choice
        options:
          - patch-only
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.5'

jobs:
  update-deps:
    name: Update Go Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Update every module
        env:
          GOWORK: off
        run: |
          set -euo pipefail

          # Discovered, not listed. A module added to the repository is
          # updated by this workflow the moment it exists.
          mapfile -t modules < <(find . -name go.mod -not -path './gui/frontend/node_modules/*' -printf '%h\n' | sort)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "::error::no Go modules found - the discovery is wrong, not the repository"
            exit 1
          fi
          echo "Updating ${#modules[@]} modules (scope: ${{ inputs.scope }})"

          for m in "${modules[@]}"; do
            echo "::group::$m"
            (
              cd "$m"
              if [ "${{ inputs.scope }}" = "patch-only" ]; then
                # Patch releases only: security fixes without API churn.
                go get -u=patch ./...
              else
                go get -u ./...
              fi
              go mod tidy
            )
            echo "::endgroup::"
          done

      - name: The workspace must still build
        run: |
          set -euo pipefail
          # A dependency bump that does not compile is worse than no bump:
          # it lands on the branch and every later push looks broken. Both
          # GOOS views, because most of this code is Windows-only.
          for goos in linux windows; do
            for tags in "" service; do
              echo "::group::GOOS=$goos tags=${tags:-none}"
              if [ -z "$tags" ]; then
                GOOS=$goos go build ./... || { echo "::error::build failed for GOOS=$goos"; exit 1; }
              else
                GOOS=$goos go build -tags "$tags" ./... || { echo "::error::build failed for GOOS=$goos tags=$tags"; exit 1; }
              fi
              echo "::endgroup::"
            done
          done

      - name: Show what changed
        run: |
          git diff --stat
          git diff

      - name: Commit and push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes - dependencies were already current."
            echo "No changes - dependencies were already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*go.mod' '*go.sum'
          git commit -m "chore(deps): update Go dependencies (${{ inputs.scope }})" \
                     -m "Dispatched on ${{ github.ref_name }}. Every module in the workspace was updated, and all four compile views were built before this was committed."
          git push

          {
            echo "## Dependencies updated"
            echo
            echo "**Scope:** ${{ inputs.scope }}"
            echo
            echo '```'
            git show --stat --oneline HEAD | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
